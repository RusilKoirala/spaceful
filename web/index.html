<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spaceful Race</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <header>
      <h1>Spaceful Race</h1>

      <span id="status">Connecting…</span>

      <label>
        Speed
        <select id="speed">
          <option>1</option>
          <option>2</option>
          <option>4</option>
          <option>8</option>
        </select>
      </label>

      <label>
        <input type="checkbox" id="rays" checked>
        Rays
      </label>

      <button id="start">Start race</button>
    </header>


    <canvas id="view" width="1280" height="720"></canvas>


    <table>
      <tbody id="board"></tbody>
    </table>

  </main>

  <script src="app.js"></script>
</body>

</html>
